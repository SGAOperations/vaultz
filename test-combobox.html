<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Combobox Test</title>
    <script src="https://unpkg.com/react@19/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@19/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: system-ui; padding: 40px; background: #f0f0f0; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 24px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // This is a test to demonstrate the ISSUE with the combobox
        const { useState } = React;
        
        function TestCombobox() {
            const [inputValue, setInputValue] = useState('');
            const [showEmpty, setShowEmpty] = useState(false);
            
            return (
                <div className="container">
                    <h1>Combobox Issue Demonstration</h1>
                    <p>The problem: CommandEmpty only renders when cmdk's internal filter determines there are no results.</p>
                    
                    <div style={{marginTop: '20px'}}>
                        <label>Search: </label>
                        <input 
                            value={inputValue}
                            onChange={(e) => {
                                setInputValue(e.target.value);
                                // Simulate: CommandEmpty would only show if cmdk says "empty"
                                setShowEmpty(e.target.value.length > 0);
                            }}
                            placeholder="Type something..."
                            style={{padding: '8px', width: '100%', marginTop: '8px'}}
                        />
                    </div>
                    
                    <div style={{marginTop: '16px', padding: '16px', border: '1px solid #ccc', borderRadius: '4px'}}>
                        {showEmpty ? (
                            inputValue.trim() ? (
                                <button style={{padding: '8px 16px', background: '#667eea', color: 'white', border: 'none', borderRadius: '4px'}}>
                                    Create "{inputValue.trim()}"
                                </button>
                            ) : (
                                <div>No user found.</div>
                            )
                        ) : (
                            <div style={{color: '#999'}}>Type to search...</div>
                        )}
                    </div>
                    
                    <div style={{marginTop: '24px', padding: '16px', background: '#fff3cd', borderRadius: '4px'}}>
                        <strong>Current State:</strong>
                        <ul>
                            <li>inputValue: "{inputValue}"</li>
                            <li>showEmpty (simulating CommandEmpty): {showEmpty ? 'true' : 'false'}</li>
                            <li>Would show create button: {(showEmpty && inputValue.trim()) ? 'YES' : 'NO'}</li>
                        </ul>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<TestCombobox />, document.getElementById('root'));
    </script>
</body>
</html>
