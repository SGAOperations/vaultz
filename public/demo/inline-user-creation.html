<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline User Creation - Working Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 32px;
            text-align: center;
        }
        .header h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .header p { font-size: 16px; opacity: 0.9; }
        .content { padding: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: #4a5568; }
        .combobox-wrapper { position: relative; }
        .combobox-trigger {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .combobox-trigger:hover { border-color: #cbd5e0; }
        .combobox-trigger.open { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1); }
        .placeholder { color: #a0aec0; }
        .arrow { color: #a0aec0; transition: transform 0.2s; }
        .combobox-trigger.open .arrow { transform: rotate(180deg); }
        .dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            overflow: hidden;
            display: none;
        }
        .dropdown.show { display: block; }
        .search-input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-bottom: 2px solid #e2e8f0;
            font-size: 14px;
            outline: none;
        }
        .empty-state { padding: 24px 16px; text-align: center; }
        .create-button {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        .create-button:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4); }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #48bb78;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }
        .steps {
            background: #f7fafc;
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }
        .steps h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #2d3748; }
        .steps ol { padding-left: 20px; }
        .steps li { margin-bottom: 12px; color: #4a5568; line-height: 1.6; }
        .code {
            background: #2d3748;
            color: #68d391;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Inline User Creation <span class="badge">WORKING</span></h1>
            <p>Create users without leaving the purchase dialog</p>
        </div>
        <div class="content">
            <div class="form-group">
                <label>Name</label>
                <div class="combobox-wrapper">
                    <div class="combobox-trigger" id="trigger">
                        <span class="placeholder">Select user...</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="dropdown" id="dropdown">
                        <input type="text" class="search-input" placeholder="Search users..." id="searchInput" />
                        <div class="empty-state">
                            <button class="create-button" id="createBtn">
                                Create "<span id="searchTerm">John Smith</span>"
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="steps">
                <h3>How It Works:</h3>
                <ol>
                    <li>Click the dropdown above and type a name</li>
                    <li>The <span class="code">Create "..."</span> button shows the name you typed</li>
                    <li>Click it to create a new user</li>
                </ol>
            </div>
        </div>
    </div>
    <script>
        const trigger = document.getElementById('trigger');
        const dropdown = document.getElementById('dropdown');
        const searchInput = document.getElementById('searchInput');
        const searchTerm = document.getElementById('searchTerm');
        const createBtn = document.getElementById('createBtn');
        
        trigger.addEventListener('click', () => {
            trigger.classList.toggle('open');
            dropdown.classList.toggle('show');
            if (dropdown.classList.contains('show')) {
                setTimeout(() => searchInput.focus(), 100);
            }
        });
        
        searchInput.addEventListener('input', (e) => {
            searchTerm.textContent = e.target.value || 'John Smith';
        });
        
        createBtn.addEventListener('click', () => {
            const name = searchInput.value || 'John Smith';
            alert(`Creating user: ${name}`);
        });
        
        document.addEventListener('click', (e) => {
            if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
                trigger.classList.remove('open');
                dropdown.classList.remove('show');
            }
        });
    </script>
</body>
</html>
