version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    groups:
      prisma:
        patterns: 
          - "@prisma*"
          - "prisma*"
      minor-dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      patch-prod-dependencies:
        dependency-type: "production"
        update-types: ["patch"]
